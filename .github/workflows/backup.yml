name: Database backup

on:
  schedule:
    # Mondays 09:00 UTC. GitHub may start scheduled runs a little late.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write # commit the backup
  actions: write # keep this schedule from being auto-disabled (see below)

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The export script has no dependencies, so no npm install.
      - name: Export tables
        run: npm run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit if anything changed
        run: |
          git add backups
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Database backup $(date -u +%Y-%m-%d)"
          git push

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity, and a quiet stretch with no score
      # changes produces no backup commits. Re-enabling the workflow on
      # every run is meant to keep the schedule alive.
      - name: Keep schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
